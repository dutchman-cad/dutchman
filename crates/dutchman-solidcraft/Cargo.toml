[package]
name = "dutchman-solidcraft"
description = "SolidCraft adapter for Dutchman: writes the neutral model as a .solidcraft design"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cadmpeg-ir.workspace = true
# The STEP writer an Import keeps its geometry in.
cadmpeg-registry = { workspace = true, features = ["step"] }
dutchman-core.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true

[dev-dependencies]
dutchman-core = { workspace = true, features = ["formats", "freecad"] }
tempfile.workspace = true
cadmpeg-ir = { workspace = true, features = ["examples"] }
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true

[lints]
workspace = true
