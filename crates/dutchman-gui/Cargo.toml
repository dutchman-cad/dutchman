[package]
name = "dutchman-gui"
description = "Dutchman Convert, Dutchman's desktop app: drop CAD designs in, get SolidCraft designs out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dutchman-gui"
path = "src/main.rs"

[features]
# Inject memory decisions for GPU screenshots without large input files.
test-support = []
default = ["freecad"]
# FreeCAD documents (.FCStd); see dutchman-core's feature of the same name.
freecad = ["dutchman/freecad"]

[dependencies]
dutchman.workspace = true
dutchman-core.workspace = true
dutchman-solidcraft.workspace = true
eframe = { version = "0.33", features = ["persistence"] }
egui_extras = { version = "0.33", default-features = false, features = ["svg"] }
pollster = "0.4"
rfd = "0.15"
serde_json.workspace = true
roxmltree.workspace = true
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true

[lints]
workspace = true
