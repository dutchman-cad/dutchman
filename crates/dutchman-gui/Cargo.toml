[package]
name = "dutchman-gui"
description = "Dutchman Convert, Dutchman's desktop app: drop CAD designs in, get SolidCraft designs out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dutchman-gui"
path = "src/main.rs"

[[bin]]
name = "dutchman-sync"
path = "src/bin/dutchman-sync.rs"

[features]
# Inject memory decisions and report transport for headless UI tests.
test-support = []
default = ["freecad"]
# FreeCAD documents (.FCStd); see dutchman-core's feature of the same name.
freecad = ["dutchman/freecad"]

[dependencies]
arboard = { version = "3.7", default-features = false }
percent-encoding = "2.3"
url = "2.5"
winit = "0.30"
dutchman.workspace = true
dutchman-core = { workspace = true, features = ["formats"] }
dutchman-solidcraft = { workspace = true, features = ["onshape"] }
eframe = { version = "0.33", features = ["persistence"] }
egui_extras = { version = "0.33", default-features = false, features = ["svg"] }
pollster = "1.0"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree.workspace = true
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# Dutchman Sync's desktop notifications: D-Bus (the pure Rust zbus) on Linux, the Windows
# toast API and the macOS notification centre elsewhere (MIT OR Apache-2.0).
notify-rust = "4.11"

# Dutchman Sync's tray icon. Windows and macOS: tray-icon (MIT OR Apache-2.0). Linux: ksni, a
# StatusNotifierItem over D-Bus (Unlicense), so no GTK or appindicator library is needed.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
ron = "0.12"
egui_kittest = { version = "0.33", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
