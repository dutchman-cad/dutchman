[package]
name = "dutchman-gui"
description = "Dutchman's desktop app: drop CAD designs in, get SolidCraft designs out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dutchman-gui"
path = "src/main.rs"

[dependencies]
dutchman.workspace = true
dutchman-solidcraft.workspace = true
eframe = "0.33"
egui_extras = { version = "0.33", default-features = false, features = ["svg"] }
pollster = "0.4"
rfd = "0.15"
serde_json.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true

[lints]
workspace = true
