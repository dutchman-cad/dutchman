[package]
name = "dutchman"
description = "Ferries CAD designs between formats: decodes native design files into open, editable models (early development)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
build = "build.rs"
keywords = ["cad", "converter", "step", "3d"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "dutchman"
path = "src/main.rs"

[[bin]]
name = "dutchman-mcp"
path = "src/bin/dutchman-mcp.rs"

[features]
default = ["freecad", "pilot"]
pilot = ["dep:dutchman-pilot"]
# FreeCAD documents (.FCStd); see dutchman-core's feature of the same name.
freecad = ["dutchman-core/freecad"]

[dependencies]
base64 = "0.22"
url = "2"
flate2 = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
ctrlc = { version = "3.5", features = ["termination"] }
tempfile.workspace = true
aho-corasick.workspace = true
clap = { workspace = true, features = ["suggestions"] }
dutchman-launcher.workspace = true
dutchman-serve = { path = "../dutchman-serve" }
dutchman-core = { workspace = true, features = ["formats"] }
dutchman-dxf.workspace = true
dutchman-freecad.workspace = true
dutchman-pilot = { workspace = true, optional = true }
dutchman-solidcraft.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
sysinfo.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
