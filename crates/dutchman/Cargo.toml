[package]
name = "dutchman"
description = "Ferries CAD designs between formats: decodes native design files into open, editable models (early development)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
build = "build.rs"
keywords = ["cad", "converter", "step", "3d"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "dutchman"
path = "src/main.rs"

[[bin]]
name = "dutchman-mcp"
path = "src/bin/dutchman-mcp.rs"

[dependencies]
clap.workspace = true
dutchman-core.workspace = true
dutchman-solidcraft.workspace = true
getrandom.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
