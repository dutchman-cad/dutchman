[package]
name = "dutchman-core"
description = "Format-neutral conversion core for Dutchman: the model, the reader/writer seams and loss reporting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-ir.workspace = true
cadmpeg-registry.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["freecad"]
# FreeCAD documents (.FCStd), through cadmpeg's fcstd codec. A build without it says where
# FreeCAD files convert instead.
freecad = ["cadmpeg-registry/fcstd"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
