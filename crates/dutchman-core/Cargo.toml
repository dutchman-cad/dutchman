[package]
name = "dutchman-core"
description = "Format-neutral conversion core for Dutchman: the model, the reader/writer seams and loss reporting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cadmpeg-core.workspace = true
cadmpeg-ir.workspace = true
cadmpeg-registry.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = []
# FreeCAD documents (.FCStd), through cadmpeg's fcstd codec. Off by default until a cadmpeg
# release reads FreeCAD solids right (docs/freecad.md); the nightly build turns it on, and a
# build without it says FreeCAD files convert in nightly builds.
freecad = ["cadmpeg-registry/fcstd"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
