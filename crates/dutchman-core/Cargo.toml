[package]
name = "dutchman-core"
description = "Format-neutral conversion core for Dutchman: the model, the reader/writer seams and loss reporting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
dutchman-launcher.workspace = true
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
cadmpeg-core.workspace = true
cadmpeg-codec-f3d.workspace = true
cadmpeg-ir.workspace = true
cadmpeg-registry.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tempfile.workspace = true
zip.workspace = true

[features]
# Every input format but FreeCAD. A build may name only the formats it reads (as a
# sandboxed importer does), so it links only those cadmpeg codecs.
default = ["formats", "source-reader"]
# Capability-based reader API for sandboxed front ends.
source-reader = []
formats = ["fusion", "inventor", "solidworks", "catia", "creo", "nx", "rhino", "step", "iges", "sat", "pvz", "onshape"]
onshape = ["step", "dep:base64", "dep:flate2"]
fusion = ["cadmpeg-registry/f3d"]
inventor = ["cadmpeg-registry/inventor"]
solidworks = ["cadmpeg-registry/sldprt"]
catia = ["cadmpeg-registry/catia"]
creo = ["cadmpeg-registry/creo"]
nx = ["cadmpeg-registry/nx"]
rhino = ["cadmpeg-registry/rhino"]
step = ["cadmpeg-registry/step"]
iges = ["cadmpeg-registry/iges"]
sat = ["cadmpeg-registry/sat"]
pvz = ["cadmpeg-registry/pvz"]
# FreeCAD documents (.FCStd), through cadmpeg's fcstd codec. `dutchman` and `dutchman-gui`
# turn it on by default; a build without it says FreeCAD files do not convert in that build.
freecad = ["cadmpeg-registry/fcstd"]

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
sysinfo.workspace = true

[dev-dependencies]
cadmpeg-ir = { workspace = true, features = ["examples"] }
zip.workspace = true

[lints]
workspace = true
