<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dutchman Convert{% endblock %}</title>
<style>
  /* The Dutchman design system's Day and Night palettes (crates/dutchman-gui/src/theme.rs). */
  :root {
    color-scheme: light dark;
    --surface: #F3F6F4; --surface-2: #DCE6E2; --ink: #0E1A24; --tide: #4D5E66;
    --hairline: #C3D0CB; --spectre: #1F7A6A; --on-spectre: #FFFFFF; --lantern: #D98E2B;
    --lantern-text: #8F5408; --danger: #B3412E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #0E1A24; --surface-2: #1B2D3B; --ink: #E6EEEA; --tide: #9DB0B5;
      --hairline: #2A4152; --spectre: #6FD3BC; --on-spectre: #0E1A24; --lantern: #E8A64A;
      --lantern-text: #E8A64A; --danger: #F08A73;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 20px 56px; }
  a { color: var(--spectre); }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  header.top svg { width: 40px; height: 40px; flex: none; }
  h1 { font: 600 26px/1.2 Spectral, Georgia, serif; margin: 0; }
  h1 a { color: inherit; text-decoration: none; }
  .sub { color: var(--tide); margin: 0 0 24px; }
  .panel { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px 18px; }
  .drop { display: block; border: 2px dashed var(--hairline); border-radius: 12px; padding: 28px 20px;
          text-align: center; cursor: pointer; background: var(--surface-2); }
  .drop.over { border-color: var(--spectre); }
  .drop strong { display: block; font-size: 17px; }
  .drop .hint { display: block; color: var(--tide); font-size: 13px; margin: 4px 0 14px; }
  .drop input { max-width: 100%; color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 16px 0 24px; }
  .row label { color: var(--tide); display: inline-flex; gap: 6px; align-items: center; }
  button { background: var(--spectre); color: var(--on-spectre); border: 0; border-radius: 9px;
           padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: progress; }
  .muted { color: var(--tide); font-size: 13px; }
  .summary { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .card { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 10px; }
  .card header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .card h2 { font-size: 15px; margin: 0; word-break: break-all; }
  .pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; border: 1px solid currentColor; }
  .pill.ok { color: var(--spectre); } .pill.failed { color: var(--danger); }
  .outcome { margin: 4px 0 0; }
  .error { color: var(--danger); margin: 6px 0 0; }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: var(--tide); }
  details ul { margin: 6px 0 0; padding-left: 18px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  .Info { color: var(--tide); } .Degraded { color: var(--lantern-text); } .Dropped { color: var(--danger); }
  .download { display: inline-block; margin-top: 10px; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 4px 8px 4px 0; vertical-align: top; border-top: 1px solid var(--hairline); }
  td:first-child { white-space: nowrap; font-weight: 600; }
  footer { color: var(--tide); font-size: 12px; margin-top: 36px; }
</style>
</head>
<body>
<main>
  <header class="top">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 9.5V45" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M30.6 14H14.5c1.4 8.2 1.4 16.2 0 24h16.1z" fill="var(--spectre)"/>
      <g fill="none" stroke="var(--spectre)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M33.4 14h16.1c-1.4 8.2-1.4 16.2 0 24H33.4z"/>
        <path d="M33.4 26h15.3M33.4 14l15.3 12M33.4 26l16.1 12"/>
      </g>
      <path d="M7 45h50l-7.5 9.5h-35z" fill="var(--ink)"/>
      <circle cx="32" cy="6.2" r="2.8" fill="var(--lantern)"/>
    </svg>
    <h1><a href="{% block home %}./{% endblock %}">Dutchman Convert</a></h1>
  </header>
  {% block content %}{% endblock %}
  <footer>{{ version }} · <a href="https://github.com/dutchman-cad/dutchman">Dutchman on GitHub</a></footer>
</main>
</body>
</html>
