# Public corpus for the "Public corpus sweep" workflow (.github/workflows/corpus-sweep.yml).
#
# Only public repositories under an open licence are listed. The workflow reads each
# repository's licence from the GitHub API and skips a source whose licence differs from the
# one recorded here, so a relicensed repository drops out until someone looks at it.
#
# Fields of a [[source]]:
#   repo          owner/name on GitHub
#   license       SPDX id, must match the repository's LICENSE
#   globs         optional; files to convert, matched case-insensitively against the path
#                 (default: [defaults].globs)
#   exclude       optional; globs to leave out (matched the same way)
#   file_presets  optional; table of glob = preset for files that need another preset
#
# Repositories checked on 2026-10-31 whose licence GitHub does not report (no LICENSE file
# or an unrecognised one) and which are therefore NOT listed:
#   VoronDesign/Voron-Trident, VoronDesign/Afterburner, VoronDesign/Stealthburner,
#   VoronDesign/Cascade, VoronDesign/Jetpack

[defaults]
globs = ["*.f3d", "*.f3z", "*.fcstd", "*.ipt", "*.iam", "*.sldprt", "*.step", "*.stp"]

