[workspace]
resolver = "2"
members = ["crates/dutchman-dxf", "crates/dutchman-launcher", "crates/dutchman", "crates/dutchman-core", "crates/dutchman-gui", "crates/dutchman-freecad", "crates/dutchman-solidcraft", "crates/dutchman-web", "crates/dutchman-serve"]

[workspace.package]
version = "0.2.5"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dutchman-cad/dutchman"

[workspace.dependencies]
dutchman-launcher = { path = "crates/dutchman-launcher", version = "0.2.1" }
# Without their default features, so each crate's own `freecad` feature decides (a build
# without FreeCAD: `cargo build -p dutchman --no-default-features`).
dutchman = { path = "crates/dutchman", version = "0.2.1", default-features = false }
dutchman-core = { path = "crates/dutchman-core", version = "0.2.5", default-features = false }
dutchman-solidcraft = { path = "crates/dutchman-solidcraft", version = "0.2.5", default-features = false }
dutchman-dxf = { path = "crates/dutchman-dxf", version = "0.2.4" }
dutchman-freecad = { path = "crates/dutchman-freecad", version = "0.2.1", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dutchman-pilot = { git = "https://github.com/dutchman-cad/pilot", rev = "a91cadeeaadf22b343e936c38f9dd4fc007dcfc3" }
aho-corasick = "1.1"
# cadmpeg at one tested commit of its main branch, the same for every cadmpeg crate. Move it
# after a batch of cadmpeg merges (docs/releasing.md); the nightly build takes cadmpeg's main.
cadmpeg-codec-f3d = { git = "https://github.com/raykholo/cadmpeg", rev = "851100d646ef4f0de05c60cf40acd6f98f2e62c8" }
cadmpeg-core = { git = "https://github.com/raykholo/cadmpeg", rev = "851100d646ef4f0de05c60cf40acd6f98f2e62c8" }
cadmpeg-ir = { git = "https://github.com/raykholo/cadmpeg", rev = "851100d646ef4f0de05c60cf40acd6f98f2e62c8" }
# Each crate turns on the cadmpeg codecs it needs: dutchman-core per input format (its
# `formats` feature for all of them), dutchman-solidcraft the STEP writer.
cadmpeg-registry = { git = "https://github.com/raykholo/cadmpeg", rev = "851100d646ef4f0de05c60cf40acd6f98f2e62c8", default-features = false }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
roxmltree = "0.21"
thiserror = "2"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Never crash: hostile input must come back as an error, never as a panic.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# Release builds keep panic = "unwind" (the default): a panic inside cadmpeg is caught and
# reported as an error, which aborting would turn into a crash.
# Sixteen codegen units build the macOS release in about half the time of one (two cold
# GitHub runs each), with the same archive sizes and no slower conversion.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
