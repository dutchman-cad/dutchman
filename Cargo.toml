[workspace]
resolver = "2"
members = ["crates/dutchman", "crates/dutchman-core", "crates/dutchman-solidcraft"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dutchman-cad/dutchman"

[workspace.dependencies]
dutchman-core = { path = "crates/dutchman-core" }
dutchman-solidcraft = { path = "crates/dutchman-solidcraft" }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
cadmpeg-core = "0.6"
cadmpeg-ir = "0.6"
cadmpeg-registry = { version = "0.6", default-features = false, features = ["f3d", "step"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Never crash: hostile input must come back as an error, never as a panic.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
