[workspace]
resolver = "2"
members = ["crates/dutchman", "crates/dutchman-core", "crates/dutchman-gui", "crates/dutchman-solidcraft"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dutchman-cad/dutchman"

[workspace.dependencies]
# Without their default features, so each crate's own `freecad` feature decides (a build
# without FreeCAD: `cargo build -p dutchman --no-default-features`).
dutchman = { path = "crates/dutchman", version = "0.1.2", default-features = false }
dutchman-core = { path = "crates/dutchman-core", version = "0.1.2", default-features = false }
dutchman-solidcraft = { path = "crates/dutchman-solidcraft", version = "0.1.2", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
cadmpeg-core = "0.6"
cadmpeg-ir = "0.6"
cadmpeg-registry = { version = "0.6", default-features = false, features = ["f3d", "inventor", "sldprt", "step"] }
getrandom = "0.3"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Never crash: hostile input must come back as an error, never as a panic.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# Release builds keep panic = "unwind" (the default): a panic inside cadmpeg is caught and
# reported as an error, which aborting would turn into a crash.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
