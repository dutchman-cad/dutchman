name: A file didn't convert
description: One file failed, lost something, or looks wrong in SolidCraft. No design files.
title: "[file] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. One file per issue, please; for a whole library, use the **Library test report** form instead.

        In the desktop app, Dutchman Convert, **Report anonymously on GitHub** on the failed file opens this form filled in; read what it filled in before you submit.

        **Do not attach design files, logs, the key file, the salt, or the journal.** They hold names and paths. The one exception is the report zip `dutchman diagnose --make-report` makes, when you are free to share the small file in it publicly. A link to a file that is already public (a GitHub repository, GrabCAD, a maker's site) is welcome: it lets us test the same file. If you are willing to let a maintainer see the file privately, say so below; we will reply with a private way to send it. File here even when the report says `upstream: cadmpeg` or `upstream: solidcraft`; we take it upstream.
  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Fusion archive (.f3d)
        - Fusion multi-document archive (.f3z)
        - Inventor part (.ipt)
        - Inventor assembly (.iam)
        - SolidWorks part (.sldprt)
        - FreeCAD document (.FCStd)
        - Other
    validations:
      required: true
  - type: input
    id: source-version
    attributes:
      label: Version that made the file
      description: >-
        Give the source program and version from its About screen or the file's metadata.
        If the exact build is unknown, give the program, desktop or web, and the years
        the files are from. Do not write only "unknown".
      placeholder: "Fusion desktop, unknown builds, files from 2020 to 2025"
    validations:
      required: true
  - type: input
    id: dutchman-version
    attributes:
      label: Dutchman version
      description: >-
        Paste what `dutchman --version` prints, and say whether it is stable or nightly.
        On a Mac, run `"/Applications/Dutchman Convert.app/Contents/Helpers/dutchman" --version`
        (or use `/Applications/Dutchman.app/…` for 0.1.5 and earlier).
      placeholder: "dutchman 0.1.5, stable"
    validations:
      required: true
  - type: input
    id: solidcraft-version
    attributes:
      label: SolidCraft version
      description: >-
        Paste what `solidcraft-cli --version` prints. Use the tool in your SolidCraft
        installation, or the path set in `SOLIDCRAFT_CLI`, if it is not on PATH.
        Write "none" when no SolidCraft was installed.
      placeholder: "solidcraft-cli 0.41, or none"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What you expected, and what happened
      description: For example "the part should convert with its history; it converted as geometry only", or "the conversion failed with this message". Paste the message Dutchman printed, with any names or paths in it replaced by `<name>`.
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Stage, upstream and code
      description: "From the report, if it shows them: the `stage`, the `upstream`, and the loss `code`."
      placeholder: "stage: decode, upstream: cadmpeg, code: f3d/geometry.not-transferred"
  - type: textarea
    id: report-anon
    attributes:
      label: Anonymous report for this file
      description: |
        The desktop app's **Report anonymously on GitHub** copies this for you to paste. From the command line, run `dutchman convert-all --out-dir converted --report-anon report-anon.json part.f3d` with your file in place of `part.f3d`, read `report-anon.json`, and paste it here. See [the anonymous report](https://github.com/dutchman-cad/dutchman/blob/main/docs/report-anon.md) and [Testing Dutchman on your library](https://github.com/dutchman-cad/dutchman/blob/main/docs/testing-your-library.md). If you find a name in it, leave that line out and say so: it is a bug.
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What the design has in common with others that fail, whether a simple test part you made shows the same problem, and whether you would share the file privately with a maintainer (never attach it here).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I read what I am posting. It holds no private file, and no names or paths from my own computer, files or company; links to files that are already public are fine.
          required: true
