name: Docker

# Builds the Docker image (docs/docker.md), converts a fixture in it and starts its MCP server.
# The image takes about 12 minutes to build, so this runs only when the Docker files change, and
# every night against main to catch a change elsewhere that breaks it.

on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dutchman:ci
          # Two compile jobs keep the release build within the runner's memory; with one per
          # core the hosted runner was lost mid-build.
          build-args: |
            CARGO_BUILD_JOBS=2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Convert a fixture in the image
        run: |
          fixtures="$PWD/crates/dutchman-core/tests/fixtures"
          docker run --rm -v "$fixtures:/work:ro" -v "$RUNNER_TEMP:/out" --user "$(id -u):$(id -g)" \
            dutchman:ci convert --json generated_unit_cube.f3d /out/cube.solidcraft | tee report.json
          grep -q '"ok":true' report.json
          test -s "$RUNNER_TEMP/cube.solidcraft"
      - name: Start the MCP server in the image
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | docker run --rm -i --entrypoint dutchman-mcp dutchman:ci | grep -q '"result"'
