name: Docker

# Builds the Docker image (docs/docker.md), converts a fixture in it and starts its MCP server.
# The image takes about 12 minutes to build, so this runs only when the Docker files change, and
# every night against main to catch a change elsewhere that breaks it.

on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml]
  # A merge queue group has no path filter: the changes job skips the build unless this group
  # touches the same files, judged against the group's base commit.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = merge_group ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && ! git diff --name-only "$BASE" HEAD \
            | grep -qE '^(Dockerfile$|\.dockerignore$|\.github/workflows/docker\.yml$)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Docker change in this merge group: skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dutchman:ci
          # Two compile jobs keep the release build within the runner's memory; with one per
          # core the hosted runner was lost mid-build.
          build-args: |
            CARGO_BUILD_JOBS=2
          cache-from: type=gha
          # A merge queue group reads the layer cache and never writes it.
          cache-to: ${{ github.event_name == 'merge_group' && '' || 'type=gha,mode=max' }}
      - name: Convert a fixture in the image
        run: |
          fixtures="$PWD/crates/dutchman-core/tests/fixtures"
          docker run --rm -v "$fixtures:/work:ro" -v "$RUNNER_TEMP:/out" --user "$(id -u):$(id -g)" \
            dutchman:ci convert --json generated_unit_cube.f3d /out/cube.solidcraft | tee report.json
          grep -q '"ok":true' report.json
          test -s "$RUNNER_TEMP/cube.solidcraft"
      - name: Start the MCP server in the image
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | docker run --rm -i --entrypoint dutchman-mcp dutchman:ci | grep -q '"result"'
