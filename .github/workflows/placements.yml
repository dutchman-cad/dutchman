name: Placements

# Converts three public assemblies and checks where every part lands against the goldens in
# corpus/placements/, so a change that scatters parts cannot merge. All three assemblies run
# on main, tags and full CI runs; merge groups run only the two small Linux checks.
# CI owns main runs to avoid building the same programs twice. This can also be dispatched.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      smoke-only:
        description: Build the tools and run only the small Linux placement checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: placements-${{ github.ref }}
  # Every push to main finishes, so it saves its cache.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
      voron: ${{ steps.diff.outputs.voron }}
      # Self-hosted 'flyer' runners: merge queue, main, and pull requests from this repository by
      # people (never forks, never bots). FLYER=off sends everything to GitHub. A direct dispatch
      # stays on GitHub. The caller's event decides when this runs as part of ci.yml.
      flyer: ${{ vars.FLYER != 'off' && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "voron=true" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci-tools-bookworm
          cache-on-failure: true
          # Only main writes the shared cache; full CI runs restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Bookworm matches the Docker runtime; host Ubuntu binaries may need a newer glibc.
      - name: Build Dutchman
        run: >
          cargo build --release --locked -p dutchman -p dutchman-web --bins
          --config profile.release.lto=false --config profile.release.codegen-units=16
      - run: target/release/dutchman --version
      - uses: actions/upload-artifact@v7
        with:
          name: dutchman-bin
          path: |
            target/release/dutchman
            target/release/dutchman-mcp
            target/release/dutchman-web
          if-no-files-found: error
          retention-days: 1

  placements:
    name: placements (${{ matrix.name }})
    needs: [changes, build]
    # The two small checks need only python3 and curl, no root: they run on 'flyer' under the rule above.
    runs-on: ${{ needs.changes.outputs.flyer == 'true' && fromJSON('["self-hosted", "flyer"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each source is fetched from a commit of its repository, by URL, and checked against
          # the recorded SHA-256. The converted part names carry the file's name, so the file is
          # saved under its original name.
          - name: railcore
            positions: smart
            file: RailCore II 300ZL - Nov 2019.f3z
            url: https://raw.githubusercontent.com/railcore/parts/81ef3be6c712e56782142dbce4b736994c4a1477/DXF/f3z/RailCore%20II%20300ZL%20-%20Nov%202019.f3z
            sha256: eb4afd93e0a5bba9159090909532a91862385f8fcf17ee74c4b687fa45b434fe
          - name: robot-arm
            positions: last-shown
            file: Assem1.f3z
            url: https://raw.githubusercontent.com/Adriaeik/fusion2URDF/4411ffbdffc0364dc6f5922c40b3e14fd7b642f8/examples/Assem1_description/Assem1.f3z
            sha256: 3fd57697437949374b76df74dbc69342d286512f0ef8f4580b5dca7c1d6dfe44
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dutchman-bin
          path: bin
      - name: Fetch the source
        run: |
          mkdir in
          curl -fsSL --retry 3 -o "in/${{ matrix.file }}" "${{ matrix.url }}"
          echo "${{ matrix.sha256 }}  in/${{ matrix.file }}" | sha256sum -c -
      - name: Convert and check the placements
        run: |
          chmod +x bin/dutchman
          mkdir out
          # Exit 1 with the design written is expected when parts couldn't be placed; the placement
          # check below still compares every placement. Any other failure stops here.
          bin/dutchman convert "in/${{ matrix.file }}" -o out/${{ matrix.name }}.sc \
            --preset standard --part-positions "${{ matrix.positions }}" --no-verify --json \
            > out/${{ matrix.name }}-report.json 2> out/convert.log \
            || python3 scripts/unproven-placements.py --only-unplaced out/${{ matrix.name }}-report.json out/${{ matrix.name }}.sc \
            || { tail -n 20 out/convert.log; exit 1; }
          python3 scripts/placements.py out/${{ matrix.name }}.sc \
            --out out/${{ matrix.name }}.json --check corpus/placements/${{ matrix.name }}.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: placements-${{ matrix.name }}
          path: |
            out/${{ matrix.name }}.json
            out/convert.log
          if-no-files-found: ignore
          retention-days: 14

  placements-voron:
    name: placements (voron)
    needs: [changes, build]
    if: ${{ !inputs.smoke-only && needs.changes.outputs.voron == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dutchman-bin
          path: bin
      - name: Add swap
        # The conversion needs about 15 GB; a runner has 16 GB. The image's own swap file is
        # replaced by a larger one on the big temporary disk.
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/extra.swap
          sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap
          sudo swapon /mnt/extra.swap
          free -g
      - name: Fetch the source
        run: |
          mkdir in
          curl -fsSL --retry 3 -o in/Voron_2.4r2_Assembly.f3d \
            https://raw.githubusercontent.com/VoronDesign/Voron-2/a192410e27ea345644ae5c4b29b4c9c40cbe1a73/CAD/Voron_2.4r2_Assembly.f3d
          echo "09ddd5561fed2f5f9cbcd13b9cda46b695d49af59240644ba164efa04ab0973f  in/Voron_2.4r2_Assembly.f3d" | sha256sum -c -
      - name: Convert and check the placements
        run: |
          chmod +x bin/dutchman
          mkdir out
          status=0
          # The job has swap the memory stop does not count, so it runs past the stop. Its peak
          # memory is logged to calibrate the stop.
          /usr/bin/time -v bin/dutchman convert in/Voron_2.4r2_Assembly.f3d -o out/voron.sc \
            --preset standard --no-verify --no-memory-check --json > out/voron-report.json 2> out/convert.log || status=$?
          grep -E 'Maximum resident|Elapsed' out/convert.log || true
          # Exit 1 with the design written and only unplaced parts is a result, not a failure.
          if [ "$status" -eq 1 ] && python3 scripts/unproven-placements.py --only-unplaced out/voron-report.json out/voron.sc; then
            status=0
          fi
          if [ "$status" -ne 0 ]; then
            tail -n 5 out/convert.log
            if [ "$status" -eq 137 ] || grep -qiE 'out of memory|memory allocation|needs about .* GB' out/convert.log; then
              echo "::error title=Voron ran out of memory::The conversion needs about 15 GB and the runner has 16 GB; this is the runner's limit, not a placement difference (exit $status)."
            else
              echo "::error title=Voron did not convert::dutchman convert exited with $status; see convert.log."
            fi
            exit 1
          fi
          python3 scripts/placements.py out/voron.sc --out out/voron.json --check corpus/placements/voron.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: placements-voron
          path: |
            out/voron.json
            out/convert.log
          if-no-files-found: ignore
          retention-days: 14
