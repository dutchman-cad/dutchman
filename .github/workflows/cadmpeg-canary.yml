name: cadmpeg main canary

# Every day, checks Dutchman against cadmpeg's main (not the pinned commit) with `cargo check`,
# so a cadmpeg change that breaks the build is noticed the day it lands, not at the next re-pin.
# One issue, labelled `cadmpeg-canary`, is opened (or commented on when cadmpeg's commit
# changed) while the build is broken, and closed when it builds again. Nothing is committed:
# scripts/use-cadmpeg-main.sh edits the checkout only.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cadmpeg-canary
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CADMPEG_REPO: https://github.com/cadmpeg/cadmpeg
  CARGO_PROFILE_DEV_DEBUG: "0"
  ISSUE_TITLE: cadmpeg main no longer builds with Dutchman
  ISSUE_LABEL: cadmpeg-canary

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cadmpeg-canary
      - name: Take cadmpeg's main
        id: pin
        run: |
          sha=$(git ls-remote "$CADMPEG_REPO" refs/heads/main | cut -f1)
          [[ $sha =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          scripts/use-cadmpeg-main.sh "$sha"
      - name: cargo check
        id: check
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --locked 2>&1 | tee check.log
      - name: Report
        if: always() && steps.pin.outputs.sha != ''
        env:
          SHA: ${{ steps.pin.outputs.sha }}
          OUTCOME: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$ISSUE_LABEL" --color B60205 \
            --description "cadmpeg main does not build with Dutchman" 2>/dev/null || true
          number=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 1 --json number -q '.[0].number // empty')
          if [ "$OUTCOME" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "cadmpeg main @ \`$SHA\` builds with Dutchman again ($RUN_URL)."
            fi
            exit 0
          fi
          {
            echo "cadmpeg main @ \`$SHA\` fails \`cargo check --workspace --all-targets\` against Dutchman."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "First error lines:"
            echo
            echo '```'
            # check.log keeps cargo's colour codes for the run log; strip them so lines start with
            # "error" for the grep.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' check.log \
              | grep -E -A4 '^(error|warning: unused)' | grep -v '^warning' | head -n 40
            echo '```'
          } > body.md
          if [ -z "$number" ]; then
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file body.md
          elif ! gh issue view "$number" --json body,comments -q '.body, .comments[].body' | grep -q "$SHA"; then
            gh issue comment "$number" --body-file body.md
          else
            echo "Issue #$number already reports cadmpeg $SHA."
          fi
