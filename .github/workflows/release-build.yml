name: Release builds

# The full release build: the dutchman command, the dutchman-mcp server and the dutchman-gui
# app for Linux x86_64 and ARM64 (in debian:bookworm), Windows x86_64 and macOS (Apple silicon
# and Intel, then a universal archive and disk image), packaged exactly as a release attaches
# them: archives, the per-user Windows MSI, the disk image, each with its .sha256. The MSI is
# installed, upgraded (to a newer and to the same version), refused a downgrade, installed as a
# standard user and uninstalled on Windows, and the release-mode updater tests run there.
#
# A release candidate is a tag `vX.Y.Z-rc.N` on the commit that may become the release. Pushing
# it runs this workflow, and that is the only build the release gets: pushing the release tag
# `vX.Y.Z` on the same commit makes release.yml download these files, check them and draft the
# release, without building again. Every release is built once, as its final candidate.
# Candidates carry the final version: Cargo.toml already says X.Y.Z and so do the programs, the
# archives and the MSI; "rc" appears only in the tag name. The MSI allows same-version upgrades,
# so rc.2 installs over rc.1. The files are kept as the artifacts dutchman-<version>-<target>
# (archive, MSI, checksums) and dutchman-<version>-macos (universal archive, disk image,
# per-chip archives), for 30 days.
#
# The `plan` job decides, and every other job waits on it, so this workflow reports on every pull
# request and the builds show as skipped when they are not needed. The builds run for:
# These builds restore and save no Rust cache: what users download is built from scratch, never from
# a cache another run could have written.
#   - a release-candidate tag `v*-rc.*` (the plan job first fails if the tag's X.Y.Z differs from
#     Cargo.toml's version; the dry-run tags `v0.0.0-rc.dryrun*` skip that check);
#   - a run started by hand on any branch (`gh workflow run release-build.yml --ref <branch>`);
#   - a pull request that changes the packaging (the paths in the `plan` job; for Cargo.toml,
#     anything but the version lines), or carries the `release-build` label (the label starts
#     the run when it is added). Other pull requests, and pushes to main, get the debug build and
#     tests of ci.yml only.
# A newer candidate tag cancels the candidate build in progress.

on:
  push:
    tags: ["v*-rc.*"]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # A merge queue group is judged like a pull request: the full builds run only when it changes
  # the packaging (compared with the group's base commit). The release-build label cannot be read
  # in the queue; a pull request that carries it has already run the full builds.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One group for candidate tags: a newer candidate cancels a running candidate build (only the
# newest candidate matters). Other runs are grouped per ref, and a newer run for the same ref
# supersedes the older. Adding an unrelated label to a pull request starts a run that decides
# nothing new; it gets its own group so it cannot cancel a build in progress. A build called by
# release.yml on a tag is never cancelled and is not in the candidate group.
concurrency:
  group: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'release-rc' || format('release-full-{0}-{1}', github.ref, github.event.action == 'labeled' && github.event.label.name != 'release-build' && 'label' || 'run') }}
  cancel-in-progress: ${{ github.event_name == 'push' || !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  DUTCHMAN_RELEASE_BUILD: "1"

jobs:
  # Whether this run builds. Always true except for a pull request or merge group, which builds when it carries
  # the `release-build` label or changes a packaging path.
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The candidate carries the final version: tag vX.Y.Z-rc.N must be the Cargo.toml version.
      - name: Check the candidate tag against Cargo.toml
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          cargo_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$tag" == v0.0.0-rc.dryrun* ]]; then
            echo "Dry run: the version check is skipped. Building the Cargo.toml version $cargo_version."
            exit 0
          fi
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]]; then
            echo "Candidate tag $tag is not of the form vX.Y.Z-rc.N." >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$cargo_version" ]]; then
            echo "Tag $tag is a candidate for ${BASH_REMATCH[1]}, but Cargo.toml says $cargo_version." >&2
            echo "Bump the version in its own pull request before the first candidate, then tag again." >&2
            exit 1
          fi
          echo "Candidate $tag matches the workspace version $cargo_version."
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'release-build') }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request or merge group: full release builds."
            exit 0
          fi
          if [ "$LABELLED" = true ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "The release-build label is set: full release builds."
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "The base commit is not available: full release builds."
            exit 0
          fi
          # Packaging (what the archives, the installer, the disk image, the updater and the
          # image are built from) and every workflow. Cargo.toml is checked below.
          packaging='^(\.github/workflows/|Dockerfile$|docker/|compose\.yaml$'
          packaging+='|scripts/[^/]*msi[^/]*$|scripts/package[^/]*$|scripts/macos-dmg\.sh$|scripts/archive-readme\.py$|scripts/downloads\.py$'
          packaging+='|assets/(install|dmg|windows)/|skills/'
          packaging+='|crates/dutchman-gui/assets/(Dutchman\.icns|dutchman-app-icon\.svg)$|crates/dutchman-gui/examples/ico\.rs$'
          packaging+='|crates/dutchman-gui/src/(update\.rs|update/))'
          matched=$(git diff --name-only "$BASE" HEAD | grep -E "$packaging" || true)
          # Cargo.toml holds the release profiles; a change other than the version lines (the
          # release pull request's bump) counts as packaging.
          cargo=$(git diff -U0 "$BASE" HEAD -- Cargo.toml | grep -E '^[-+][^-+]' \
            | grep -vE '^[-+](version = "[^"]*"|dutchman-(core|solidcraft) = \{.*version = "[^"]*".*\})$' || true)
          if [ -n "$cargo" ]; then matched="$matched${matched:+$'\n'}Cargo.toml"; fi
          if [ -n "$matched" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Packaging files changed: full release builds."
            echo "$matched" | head -20
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "No packaging change and no release-build label: the release builds are skipped (ci.yml tests the debug profile)."
          fi

  build:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two compile jobs on Linux keep the release links (thin LTO, 16 codegen units)
          # within the runner's memory; with more, the x86_64 runner was lost mid-build.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: debian:bookworm
            jobs: 2
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:bookworm
            jobs: 2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            jobs: 4
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    # An uncached Windows release build alone takes 65-87 minutes; the Windows job then
    # builds and tests the installer and compiles the release updater tests.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 150 || 90 }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config python3 libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build archive programs
        shell: bash
        run: |
          packages=(-p dutchman -p dutchman-gui)
          if [[ '${{ matrix.target }}' == *linux* ]]; then
            packages+=(-p dutchman-web)
          fi
          cargo build --release --locked "${packages[@]}" --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-${version}-${{ matrix.target }}" "v$version")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: '6.0.x'
      - name: Install WiX (build tool only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX' }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Build and test per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the release version' }
          $version = ($metadata.packages | Where-Object name -eq 'dutchman').version
          cargo run --release --locked -p dutchman-gui --target x86_64-pc-windows-msvc --example ico -- dist/Dutchman.ico
          if ($LASTEXITCODE -ne 0) { throw 'Could not render the Windows icon' }
          ./scripts/windows-msi.ps1 -Version $version
          ./scripts/test-windows-msi.ps1 -Version $version
          $env:DUTCHMAN_PORTABLE_TEST_ARCHIVE = (Resolve-Path "dist/$env:ARCHIVE").Path
          cargo test --release --locked -p dutchman-gui --target x86_64-pc-windows-msvc --lib update:: -- --include-ignored
          if ($LASTEXITCODE -ne 0) { throw 'The Windows updater tests failed' }
      - name: Keep Windows installer logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-logs
          path: dist/*.log
          if-no-files-found: ignore
      # On a pull request, keep the built installer for a manual check on a real Windows PC,
      # even when a later updater test fails. Release runs publish it with the archive below.
      - name: Keep the Windows installer for review
        if: always() && runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/dutchman-*.msi
            dist/dutchman-*.msi.sha256
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
            dist/*.msi
            dist/*.msi.sha256
          retention-days: 30

  # Each Mac target gets an Apple silicon runner; Intel stays cross-compiled.
  macos-build:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build archive programs
        run: cargo build --release --locked -p dutchman -p dutchman-gui --target ${{ matrix.target }}
      - name: Package
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          if [[ '${{ matrix.target }}' == x86_64-apple-darwin ]]; then
            export SKIP_RUN=1
          fi
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-${version}-${{ matrix.target }}" "v$version")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-archive-${{ matrix.target }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          retention-days: 30

  # Reuse the checked archives for the universal archive and disk image; no second Rust build.
  macos:
    needs: macos-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-archive-*
          path: dist
          merge-multiple: true
      - name: Package
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          name="dutchman-${version}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            archive="${name}-${target}.tar.gz"
            (cd dist && shasum -a 256 -c "$archive.sha256" && tar xzf "$archive")
          done
          scripts/package-universal.sh "${name}-macos-universal" "v$version" \
            "dist/${name}-aarch64-apple-darwin" "dist/${name}-x86_64-apple-darwin"
          dmg="${name}-macos-universal.dmg"
          scripts/macos-dmg.sh "$version" "$version" \
            "dist/${name}-aarch64-apple-darwin" "dist/${name}-x86_64-apple-darwin" "dist/$dmg"
          (cd dist && shasum -a 256 "$dmg" > "$dmg.sha256")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: dutchman-${{ env.VERSION }}-macos
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 30

  image-check:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dutchman-*-unknown-linux-gnu.tar.gz
          path: artifacts
          merge-multiple: true
      - name: Verify and unpack Linux archives
        run: bash docker/prepare-context.sh artifacts build-context
      - name: Read image metadata
        id: metadata
        run: |
          python3 - <<'PYMETA'
          import os, tomllib
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["workspace"]["package"]
          version = package["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"version={version}", file=f)
              print(f"licenses={package['license']}", file=f)
          PYMETA
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: build-context
          file: docker/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            dutchman:check
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
