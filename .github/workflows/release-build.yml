name: Release builds

# Builds the dutchman command, the dutchman-mcp server and the dutchman-gui app for each
# platform and keeps the archives as workflow artifacts, with a macOS disk image holding
# Dutchman.app for Apple silicon and Intel.
# Nothing is published from here.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-build.yml
      - Cargo.toml
      - scripts/macos-dmg.sh

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p dutchman -p dutchman-gui --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          name="dutchman-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=""
          [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          cp "target/${{ matrix.target }}/release/dutchman$exe" "dist/$name/"
          cp "target/${{ matrix.target }}/release/dutchman-mcp$exe" "dist/$name/"
          cp "target/${{ matrix.target }}/release/dutchman-gui$exe" "dist/$name/"
          cp LICENSE NOTICE "dist/$name/"
          # The archive holds none of the files the README links to: point them at the tag.
          python3 -I scripts/archive-readme.py "v$version" README.md "dist/$name/README.md"
          mkdir -p "dist/$name/licences"
          cp crates/dutchman-gui/assets/fonts/*.txt "dist/$name/licences/"
          "dist/$name/dutchman$exe" --version
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' | "dist/$name/dutchman-mcp$exe" | grep -q '"result"'
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          retention-days: 30

  macos-dmg:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dutchman-*-apple-darwin.tar.gz
          path: artifacts
          merge-multiple: true
      - name: Package Dutchman.app
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            tar xzf "artifacts/dutchman-${version}-${target}.tar.gz" -C artifacts
          done
          name="dutchman-${version}-macos-universal.dmg"
          mkdir -p dist
          scripts/macos-dmg.sh "$version" "$version" \
            "artifacts/dutchman-${version}-aarch64-apple-darwin" \
            "artifacts/dutchman-${version}-x86_64-apple-darwin" "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
          echo "DMG=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG }}
          path: |
            dist/${{ env.DMG }}
            dist/${{ env.DMG }}.sha256
          retention-days: 30
