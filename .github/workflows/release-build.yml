name: Release builds

# The full release build: the dutchman command, the dutchman-mcp server and the dutchman-gui
# app for Linux x86_64 and ARM64 (in debian:bookworm), Windows x86_64 and macOS (Apple silicon
# and Intel, then a universal archive and disk image), packaged exactly as a release attaches
# them: archives, the per-user Windows MSI, the disk image, each with its .sha256. The MSI is
# installed, upgraded (to a newer and to the same version), refused a downgrade, installed as a
# standard user and uninstalled on Windows, and the release-mode updater tests run there.
#
# On Linux each build also makes an AppImage, dutchman-<version>-<arch>.AppImage, that starts the
# desktop app and holds the command line programs, with the .zsync that delta updates read.
#
# A release candidate is a tag `vX.Y.Z-rc.N` on the commit that may become the release. Pushing
# it runs this workflow. Pushing the stable tag runs the full checks and builds again, while
# release.yml still promotes the candidate's files from that exact commit into the draft.
# Candidates carry the final version: Cargo.toml already says X.Y.Z and so do the programs, the
# archives and the MSI; "rc" appears only in the tag name. The MSI allows same-version upgrades,
# so rc.2 installs over rc.1. The files are kept as the artifacts dutchman-<version>-<target>
# (archive, MSI, checksums) and dutchman-<version>-macos (universal archive, disk image,
# per-chip archives), for 30 days.
#
# The `plan` job enables the full builds for explicit CI dispatches, candidate and
# stable tags, and manual runs. PRs run only ci.yml fast checks; dispatch ci.yml on a PR branch
# to exercise the full queue matrix; add release-builds=true for packaging. These release builds restore and save no Rust cache.
# A newer candidate tag cancels the candidate build in progress.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Build just the Linux x86_64 tarball for measurements.
      targets:
        description: "Which builds to run: all, or linux-x86_64 for just the Linux x86_64 tarball"
        type: choice
        options: [all, linux-x86_64]
        default: all
  # Called only for full CI runs; standalone tag runs keep release artifacts discoverable.
  workflow_call:
    outputs:
      required:
        description: Result of the non-macOS release builds and checks
        value: ${{ jobs.required.outputs.result }}
    inputs:
      targets:
        type: string
        default: all

permissions:
  contents: read
  actions: read

# Candidate tags share a group; stable tags never cancel a candidate or each other.
# Use a fixed prefix: github.workflow is the caller name in a reusable workflow.
concurrency:
  group: ${{ github.event_name == 'push' && contains(github.ref, '-rc.') && 'release-rc' || format('release-full-{0}', github.ref) }}
  cancel-in-progress: ${{ contains(github.ref, '-rc.') || !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  DUTCHMAN_RELEASE_BUILD: "1"

jobs:
  # No macOS dependencies: a missing hosted runner must not affect the queue's required result.
  required:
    needs: [plan, build, image-check]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - id: result
        env:
          RESULT: ${{ needs.plan.result == 'success' && needs.build.result == 'success' && (needs.image-check.result == 'success' || (inputs.targets == 'linux-x86_64' && needs.image-check.result == 'skipped')) && 'success' || 'failure' }}
        run: |
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          test "$RESULT" = success

  # Release tags and explicit dispatches build all requested targets.
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require full CI on the release commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/require-green-ci.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME"
      # Both candidate and stable tags must match the final version in Cargo.toml.
      - name: Check the tag against Cargo.toml
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          cargo_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$tag" == v0.0.0-rc.dryrun* || "$tag" == v0.0.0-dryrun* ]]; then
            echo "Dry run: the version check is skipped. Building the Cargo.toml version $cargo_version."
            exit 0
          fi
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "Tag $tag must be vX.Y.Z or vX.Y.Z-rc.N." >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$cargo_version" ]]; then
            echo "Tag $tag names ${BASH_REMATCH[1]}, but Cargo.toml says $cargo_version." >&2
            echo "Bump the version in its own pull request before the first candidate, then tag again." >&2
            exit 1
          fi
          echo "Tag $tag matches the workspace version $cargo_version."
      - id: plan
        run: echo "full=true" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Two compile jobs on Linux keep the release links (thin LTO, 16 codegen units)
        # within the runner's memory; with more, the x86_64 runner was lost mid-build.
        include: >-
          ${{ fromJSON(inputs.targets == 'linux-x86_64' &&
            '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","container":"debian:bookworm","jobs":2}]' ||
            '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","container":"debian:bookworm","jobs":2},
              {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","container":"debian:bookworm","jobs":2},
              {"os":"windows-latest","target":"x86_64-pc-windows-msvc","jobs":4}]') }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    # Release builds are uncached. rc.1 measured 176 minutes on Windows (release build, then the
    # installer and the release updater tests) and 140 on arm64 Linux, close to the old 180 cap.
    timeout-minutes: 300
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config python3 squashfs-tools zsync file libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build archive programs
        shell: bash
        run: |
          packages=(-p dutchman -p dutchman-gui)
          if [[ '${{ matrix.target }}' == *linux* ]]; then
            packages+=(-p dutchman-web)
          fi
          cargo build --release --locked "${packages[@]}" --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-${version}-${{ matrix.target }}" "v$version")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Package the AppImage
        if: runner.os == 'Linux'
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          scripts/package-appimage.sh ${{ matrix.target }} "$version"
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          dotnet-version: '6.0.x'
      - name: Install WiX (build tool only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX' }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Build and test per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the release version' }
          $version = ($metadata.packages | Where-Object name -eq 'dutchman').version
          cargo run --release --locked -p dutchman-gui --target x86_64-pc-windows-msvc --example ico -- dist/Dutchman.ico
          if ($LASTEXITCODE -ne 0) { throw 'Could not render the Windows icon' }
          ./scripts/windows-msi.ps1 -Version $version
          ./scripts/test-windows-msi.ps1 -Version $version
          $env:DUTCHMAN_PORTABLE_TEST_ARCHIVE = (Resolve-Path "dist/$env:ARCHIVE").Path
          cargo test --release --locked -p dutchman-gui --target x86_64-pc-windows-msvc --lib update:: -- --include-ignored
          if ($LASTEXITCODE -ne 0) { throw 'The Windows updater tests failed' }
      - name: Keep Windows installer logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-logs
          path: dist/*.log
          if-no-files-found: ignore
      # On a manual branch run, keep the installer for review even if an updater test fails.
      - name: Keep the Windows installer for review
        if: always() && runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/dutchman-*.msi
            dist/dutchman-*.msi.sha256
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync
            dist/*.AppImage.zsync.sha256
          retention-days: 30

  # Each Mac target gets an Apple silicon runner; Intel stays cross-compiled.
  macos-build:
    needs: plan
    if: needs.plan.outputs.full == 'true' && inputs.targets != 'linux-x86_64'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build archive programs
        run: cargo build --release --locked -p dutchman -p dutchman-gui --target ${{ matrix.target }}
      - name: Package
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          if [[ '${{ matrix.target }}' == x86_64-apple-darwin ]]; then
            export SKIP_RUN=1
          fi
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-${version}-${{ matrix.target }}" "v$version")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-archive-${{ matrix.target }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          retention-days: 30

  # Reuse the checked archives for the universal archive and disk image; no second Rust build.
  macos:
    needs: macos-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-archive-*
          path: dist
          merge-multiple: true
      - name: Package
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          name="dutchman-${version}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            archive="${name}-${target}.tar.gz"
            (cd dist && shasum -a 256 -c "$archive.sha256" && tar xzf "$archive")
          done
          scripts/package-universal.sh "${name}-macos-universal" "v$version" \
            "dist/${name}-aarch64-apple-darwin" "dist/${name}-x86_64-apple-darwin"
          dmg="${name}-macos-universal.dmg"
          scripts/macos-dmg.sh "$version" "$version" \
            "dist/${name}-aarch64-apple-darwin" "dist/${name}-x86_64-apple-darwin" "dist/$dmg"
          (cd dist && shasum -a 256 "$dmg" > "$dmg.sha256")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: dutchman-${{ env.VERSION }}-macos
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 30

  image-check:
    needs: build
    if: inputs.targets != 'linux-x86_64'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dutchman-*-unknown-linux-gnu.tar.gz
          path: artifacts
          merge-multiple: true
      - name: Verify and unpack Linux archives
        run: bash docker/prepare-context.sh artifacts build-context
      - name: Read image metadata
        id: metadata
        run: |
          python3 - <<'PYMETA'
          import os, tomllib
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["workspace"]["package"]
          version = package["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"version={version}", file=f)
              print(f"licenses={package['license']}", file=f)
          PYMETA
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: build-context
          file: docker/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            dutchman:check
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
      - name: Read the SolidCraft pin
        run: grep -E '^SOLIDCRAFT_[A-Z0-9_]+=[0-9a-f.]+$' docker/solidcraft.env >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: build-context
          file: docker/release.Dockerfile
          target: solidcraft
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            dutchman:check-solidcraft
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
            SOLIDCRAFT_VERSION=${{ env.SOLIDCRAFT_VERSION }}
            SOLIDCRAFT_SHA256_AMD64=${{ env.SOLIDCRAFT_SHA256_AMD64 }}
            SOLIDCRAFT_SHA256_ARM64=${{ env.SOLIDCRAFT_SHA256_ARM64 }}
