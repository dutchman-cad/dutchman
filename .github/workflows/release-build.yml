name: Release builds

# Builds the dutchman command, the dutchman-mcp server and the dutchman-gui app for each
# platform and keeps the archives as workflow artifacts, with a macOS disk image holding
# Dutchman.app for Apple silicon and Intel. Runs for a release tag, on demand, and for a pull
# request that changes the packaging; never for every push to main, as the account runs few
# macOS jobs at once. Nothing is published from here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-build.yml
      - scripts/package-archive.sh
      - scripts/macos-dmg.sh
      - scripts/archive-readme.py
      - crates/dutchman-gui/assets/Dutchman.icns

permissions:
  contents: read

# A newer run for the same ref cancels the one it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p dutchman -p dutchman-gui --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-${version}-${{ matrix.target }}" "v$version")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          retention-days: 30

  # Both Mac targets on one Apple silicon runner (Intel cross-compiled), then the disk image.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p dutchman -p dutchman-gui --target "$target"
          done
      - name: Package
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          scripts/package-archive.sh aarch64-apple-darwin "dutchman-${version}-aarch64-apple-darwin" "v$version"
          SKIP_RUN=1 scripts/package-archive.sh x86_64-apple-darwin "dutchman-${version}-x86_64-apple-darwin" "v$version"
          dmg="dutchman-${version}-macos-universal.dmg"
          scripts/macos-dmg.sh "$version" "$version" \
            target/aarch64-apple-darwin/release target/x86_64-apple-darwin/release "dist/$dmg"
          (cd dist && shasum -a 256 "$dmg" > "$dmg.sha256")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: dutchman-${{ env.VERSION }}-macos
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 30
