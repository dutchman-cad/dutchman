name: Release builds

# Builds the dutchman command, the dutchman-mcp server and the dutchman-gui app for each
# platform and keeps the archives as workflow artifacts, with a macOS disk image holding
# Dutchman Convert.app for Apple silicon and Intel. Runs for a release tag, on demand, and
# for a pull request that changes the packaging; never for every push to main, as the
# account runs few macOS jobs at once. Release notes alone do not trigger it: ci.yml's
# release-notes job checks them, and the tag build after a release PR builds every platform
# anyway, so a release PR no longer builds them all twice. A pushed tag also creates a draft
# release; the container image is published only when the release is (release-image.yml).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-build.yml
      - scripts/package-archive.sh
      - scripts/package-universal.sh
      - scripts/macos-dmg.sh
      - scripts/archive-readme.py
      - scripts/downloads.py
      - crates/dutchman-gui/assets/Dutchman.icns
      - assets/dmg/**
      - docker/**

permissions:
  contents: read

# A newer run for the same ref cancels the one it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DUTCHMAN_RELEASE_BUILD: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two compile jobs on Linux keep the release links (thin LTO, 16 codegen units)
          # within the runner's memory; with more, the x86_64 runner was lost mid-build.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: debian:bookworm
            jobs: 2
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:bookworm
            jobs: 2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            jobs: 4
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config python3 libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.container }}-${{ matrix.target }}
      - name: Build archive programs
        shell: bash
        run: |
          packages=(-p dutchman -p dutchman-gui)
          if [[ '${{ matrix.target }}' == *linux* ]]; then
            packages+=(-p dutchman-web)
          fi
          cargo build --release --locked "${packages[@]}" --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-${version}-${{ matrix.target }}" "v$version")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          retention-days: 30

  # Each Mac target gets an Apple silicon runner; Intel stays cross-compiled.
  macos-build:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Share each target's release dependencies with main's nightly, including tag runs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release-${{ matrix.target }}
      - name: Build archive programs
        run: cargo build --release --locked -p dutchman -p dutchman-gui --target ${{ matrix.target }}
      - name: Package
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          if [[ '${{ matrix.target }}' == x86_64-apple-darwin ]]; then
            export SKIP_RUN=1
          fi
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-${version}-${{ matrix.target }}" "v$version")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-archive-${{ matrix.target }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          retention-days: 30

  # Reuse the checked archives for the universal archive and disk image; no second Rust build.
  macos:
    needs: macos-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-archive-*
          path: dist
          merge-multiple: true
      - name: Package
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          name="dutchman-${version}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            archive="${name}-${target}.tar.gz"
            (cd dist && shasum -a 256 -c "$archive.sha256" && tar xzf "$archive")
          done
          scripts/package-universal.sh "${name}-macos-universal" "v$version" \
            "dist/${name}-aarch64-apple-darwin" "dist/${name}-x86_64-apple-darwin"
          dmg="${name}-macos-universal.dmg"
          scripts/macos-dmg.sh "$version" "$version" \
            "dist/${name}-aarch64-apple-darwin" "dist/${name}-x86_64-apple-darwin" "dist/$dmg"
          (cd dist && shasum -a 256 "$dmg" > "$dmg.sha256")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: dutchman-${{ env.VERSION }}-macos
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 30

  draft-release:
    needs: [build, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      # Only the release archives: a Docker build record uploaded by an image build is not a
      # release file and cannot be downloaded as one.
      - uses: actions/download-artifact@v8
        with:
          pattern: dutchman-[0-9]*
          path: artifacts
      - name: Flatten artifacts and check checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [[ -e "dist/$name" ]]; then
              echo "Duplicate release artifact: $name" >&2
              exit 1
            fi
            mv "$file" "dist/$name"
          done < <(find artifacts -type f -print0)
          cd dist
          shopt -s nullglob
          checksums=(*.sha256)
          if (( ${#checksums[@]} == 0 )); then
            echo "No release checksums were downloaded." >&2
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            sha256sum --check --strict "$checksum"
          done
          for file in *; do
            if [[ "$file" != *.sha256 && ! -f "$file.sha256" ]]; then
              echo "Missing release checksum: $file.sha256" >&2
              exit 1
            fi
          done
          # Version-less copies, so the README's releases/latest/download links always name the
          # latest published release (dutchman-<version>-<target> -> dutchman-<target>).
          version="${GITHUB_REF_NAME#v}"
          for file in dutchman-"$version"-*; do
            [[ "$file" == *.sha256 ]] && continue
            latest="dutchman-${file#dutchman-"$version"-}"
            cp "$file" "$latest"
            sha256sum "$latest" > "$latest.sha256"
          done
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .html_url")
          if [[ -n "$existing" ]]; then
            echo "A release already exists for $tag; remove it explicitly before retrying." >&2
            exit 1
          fi
          python3 scripts/release-notes.py "$version" > notes.md
          files=(dist/*)
          gh release create "$tag" --draft --verify-tag --title "Dutchman $version" -F notes.md "${files[@]}"

  image-check:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dutchman-*-unknown-linux-gnu.tar.gz
          path: artifacts
          merge-multiple: true
      - name: Verify and unpack Linux archives
        run: bash docker/prepare-context.sh artifacts build-context
      - name: Read image metadata
        id: metadata
        run: |
          python3 - <<'PYMETA'
          import os, tomllib
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["workspace"]["package"]
          version = package["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"version={version}", file=f)
              print(f"licenses={package['license']}", file=f)
          PYMETA
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: build-context
          file: docker/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            dutchman:check
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
