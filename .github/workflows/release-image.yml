name: Release image

# Publishes ghcr.io/dutchman-cad/dutchman:X.Y.Z and :latest when a release is published, from
# that release's own checksum-verified Linux archives, with no second Rust build. A pushed tag
# only makes a draft (release-build.yml), so nothing reaches the registry before a maintainer
# publishes the release. Runs on demand for a published release tag too, to republish its image.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to publish the image for (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  image:
    # The nightly pre-release publishes its own :nightly image (nightly.yml).
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Download the published Linux archives
        run: |
          state=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [[ "$state" != "false false" ]]; then
            echo "$TAG is not a published release (draft, pre-release: $state)." >&2
            exit 1
          fi
          gh release download "$TAG" --dir artifacts \
            --pattern 'dutchman-*-unknown-linux-gnu.tar.gz' \
            --pattern 'dutchman-*-unknown-linux-gnu.tar.gz.sha256'
      - name: Verify and unpack Linux archives
        run: bash docker/prepare-context.sh artifacts build-context
      - name: Read image metadata
        id: metadata
        run: |
          python3 - <<'PYMETA'
          import os, tomllib
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["workspace"]["package"]
          version = os.environ["TAG"].removeprefix("v")
          if version != package["version"]:
              raise SystemExit("Release tag must match the Cargo.toml version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"version={version}", file=f)
              print(f"licenses={package['license']}", file=f)
          PYMETA
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: build-context
          file: docker/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dutchman-cad/dutchman:${{ steps.metadata.outputs.version }}
            ghcr.io/dutchman-cad/dutchman:latest
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
