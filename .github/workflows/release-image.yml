name: Release image

# Publishes ghcr.io/dutchman-cad/dutchman:X.Y.Z and :latest, and the same image with SolidCraft's
# checker as :X.Y.Z-solidcraft and :latest-solidcraft (docker/solidcraft.env), when a release is published, from
# that release's own checksum-verified Linux archives, with no second Rust build. A pushed tag
# only makes a draft (release.yml), so nothing reaches the registry before a maintainer
# publishes the release. Runs on demand for a published release tag too, to republish its image.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to publish the image for (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  image:
    # The nightly pre-release publishes its own :nightly image (nightly.yml).
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Download the published Linux archives
        run: |
          state=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [[ "$state" != "false false" ]]; then
            echo "$TAG is not a published release (draft, pre-release: $state)." >&2
            exit 1
          fi
          gh release download "$TAG" --dir artifacts \
            --pattern 'dutchman-*-unknown-linux-gnu.tar.gz' \
            --pattern 'dutchman-*-unknown-linux-gnu.tar.gz.sha256'
      - name: Verify and unpack Linux archives
        run: bash docker/prepare-context.sh artifacts build-context
      - name: Read image metadata
        id: metadata
        run: |
          python3 - <<'PYMETA'
          import os, tomllib
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["workspace"]["package"]
          version = os.environ["TAG"].removeprefix("v")
          if version != package["version"]:
              raise SystemExit("Release tag must match the Cargo.toml version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"version={version}", file=f)
              print(f"licenses={package['license']}", file=f)
          PYMETA
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image to check it
        uses: docker/build-push-action@v7
        with:
          context: build-context
          file: docker/release.Dockerfile
          target: default
          load: true
          tags: dutchman:check
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
      # Nothing is pushed unless the image converts a design and starts its servers.
      - name: Convert a fixture in the image
        timeout-minutes: 5
        run: |
          fixtures="$PWD/crates/dutchman-core/tests/fixtures"
          docker run --rm -v "$fixtures:/work:ro" -v "$RUNNER_TEMP:/out" --user "$(id -u):$(id -g)" \
            dutchman:check convert --json generated_unit_cube.f3d /out/cube.solidcraft | tee report.json
          grep -q '"ok":true' report.json
          test -s "$RUNNER_TEMP/cube.solidcraft"
      - name: Start the MCP server in the image
        timeout-minutes: 2
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"1"}}}' \
            | docker run --rm -i --entrypoint dutchman-mcp dutchman:check | grep -q '"result"'
      - name: Convert through the web server in the image
        timeout-minutes: 5
        run: |
          docker run -d --name web -p 8080:8080 -e DUTCHMAN_WEB_PASSWORD=release --entrypoint dutchman-web dutchman:check
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 401
          curl -fsS -u dutchman:release -F files=@crates/dutchman-core/tests/fixtures/generated_unit_cube.f3d \
            http://127.0.0.1:8080/api/convert | tee web.json
          grep -q '"converted":1' web.json
          docker rm -f web
      - uses: docker/build-push-action@v7
        with:
          context: build-context
          file: docker/release.Dockerfile
          target: default
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dutchman-cad/dutchman:${{ steps.metadata.outputs.version }}
            ghcr.io/dutchman-cad/dutchman:latest
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
      - name: Read the SolidCraft pin
        run: grep -E '^SOLIDCRAFT_[A-Z0-9_]+=[0-9a-f.]+$' docker/solidcraft.env >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: build-context
          file: docker/release.Dockerfile
          target: solidcraft
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dutchman-cad/dutchman:${{ steps.metadata.outputs.version }}-solidcraft
            ghcr.io/dutchman-cad/dutchman:latest-solidcraft
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
            SOLIDCRAFT_VERSION=${{ env.SOLIDCRAFT_VERSION }}
            SOLIDCRAFT_SHA256_AMD64=${{ env.SOLIDCRAFT_SHA256_AMD64 }}
            SOLIDCRAFT_SHA256_ARM64=${{ env.SOLIDCRAFT_SHA256_ARM64 }}
