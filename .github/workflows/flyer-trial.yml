name: Flyer trial

# Trial of the self-hosted 'flyer' runner: the merge queue's Linux build and test, run by hand
# only (never on pull requests, so no fork code reaches the machine). Compare its wall-clock
# with the same job on GitHub's runner (ci.yml 'test', ubuntu-latest).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flyer-trial
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, flyer]
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Keep the build outside the checkout, which is cleaned on every run, so the second run is warm.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../flyer-target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain and cache
        run: |
          rustc -V; cargo -V; nproc; free -g | head -n 2
          if command -v sccache >/dev/null; then echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"; sccache --zero-stats >/dev/null || true; fi
      - run: cargo test --workspace --locked --features dutchman-gui/test-support
      - run: cargo test --locked -p dutchman --no-default-features
      - name: Cache statistics
        if: always()
        run: command -v sccache >/dev/null && sccache --show-stats || true
