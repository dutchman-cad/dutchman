name: Issue claims

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

# No workflow-wide concurrency group: GitHub keeps only one pending run per group, so a burst
# of events would cancel queued runs and lose commands. Each job serialises per issue or per
# pull request instead.

jobs:
  comment:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'issues') &&
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || github.event.sender.type != 'Bot')
    concurrency:
      group: claim-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/claim
          persist-credentials: false
      - run: python3 scripts/claim/claim.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  automation:
    if: github.event_name != 'issue_comment' && github.event_name != 'issues'
    concurrency:
      group: claim-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'sweep' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Always trusted default-branch code, including for fork PR events.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/claim
          persist-credentials: false
      - run: python3 scripts/claim/claim.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
