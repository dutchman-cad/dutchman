name: Site version

# When a final release is published, checks that the public site (dutchmancad.xyz, repo
# dutchman-cad/dutchman-cad.github.io) points at it. The site takes its version label and Arch
# package link from the latest-release API, so only its fallbacks and the formats report are
# pinned; this fails, and says which, when one is behind. It writes nothing and uses no secret.
#
# Dry run: gh workflow run site-version.yml --ref site-version-auto -f tag=vX.Y.Z
# with the tag of any published final release (it reads the tag, never changes anything).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published final release tag to check the site against (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  site:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the site
        run: scripts/check-site-version.sh "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
