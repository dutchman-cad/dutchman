name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue (docs/merge-queue.md) tests each group on a temporary branch: judged like a
  # pull request, against the commit the group is based on.
  merge_group:
    types: [checks_requested]
  # Started by hand, and by the SolidCraft window workflow for the pull request it opens (pull
  # requests opened with the default token do not start workflows). Judged like a pull request.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main finishes its run; a newer push cancels an older one elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Rust build caches (Swatinem/rust-cache): every job names a shared-key per platform and profile,
# so a pull request restores the cache main saved for the same job. Only pushes to main (and
# runs started by hand on main) save, so pull requests and merge queue groups never evict each other's or main's cache.

jobs:
  # Whether the change touches Rust code, which the macOS tests (macOS runners are scarce) wait on;
  # whether it is code at all (a docs-only change runs only the docs and release-notes jobs);
  # or the Docker image, which the Docker job waits on (on pull requests, only the image's own
  # inputs; on main, any crate).
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      code: ${{ steps.diff.outputs.code }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything besides Markdown, docs/, assets/, images and changelog fragments is code.
          if git diff --name-only "$BASE" HEAD \
            | grep -qvE '(\.md$|^docs/|^assets/|^changelog\.d/|\.(png|jpe?g|svg|webp)$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BASE" HEAD \
            | grep -qE '^(crates/|Cargo\.(toml|lock)$|clippy\.toml$|rust-toolchain|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          # The image is a full release build (40-80 minutes), so pull requests build it only when
          # the image itself or the web server it serves changes; every push to main builds it.
          if [ "${{ github.event_name }}" = push ]; then
            image='^(crates/|Cargo\.(toml|lock)$|Dockerfile$|\.dockerignore$|\.github/workflows/ci\.yml$)'
          else
            image='^(Dockerfile$|\.dockerignore$|crates/dutchman-web/|docs/docker\.md$|\.github/workflows/ci\.yml$)'
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE "$image"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/changelog.py check
      # The installed guidance (docs/, skills/) the archives and installer carry: a change to docs/
      # no longer starts the release builds, so check here that it still stages.
      - run: python3 scripts/package-docs.py "$RUNNER_TEMP/guide" --wix "$RUNNER_TEMP/guide.wxs"

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-linux-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Debug-profile build and tests on Linux x86_64 and ARM64 and Windows (macOS is test-macos
    # below). Inventor and SolidWorks users are mostly on Windows; macOS has a case-insensitive
    # filesystem. Both matter to finding an assembly's part files. The optimised release builds
    # are not made here: release-build.yml makes them for release and packaging changes.
    strategy:
      fail-fast: false
      matrix:
        # ARM64 is test-arm below, which gets a second try when its runner is shut down.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Debug info is most of a cold Windows build's time and is not needed to run the tests.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # The Linux runner fills its disk building every crate's tests: free toolchains no job
      # here uses.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-debug
          # Save the build even when a test fails, so the next run does not start cold.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The desktop app's test seams (fixed checker text, previews, isolated folders) sit behind
      # its test-support feature. Turning it on in the workspace run tests them on every platform
      # in one build; a separate `-p dutchman-gui` run resolves its dependencies' features apart
      # from the workspace and so compiled every crate a second time.
      - run: cargo test --workspace --locked --features dutchman-gui/test-support
      # A build without FreeCAD says it leaves FreeCAD files out. This checks feature gating, not
      # the platform, and on another OS it would rebuild every crate a second time.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p dutchman --no-default-features

  # The tests on Linux ARM64, as test runs them. GitHub's ARM runners are sometimes shut down
  # mid-job (exit code 143, "The runner has received a shutdown signal"); test-arm-again then
  # runs them once more, and ci-result counts that second try in place of the first.
  test-arm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Two compile jobs at a time keep the build within the ARM runner's memory; with one per
      # core it is shut down while compiling the desktop app and web crates.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu-24.04-arm-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked --features dutchman-gui/test-support

  # A second try of test-arm, only when its runner was shut down; a real failure is not retried.
  test-arm-again:
    needs: [changes, test-arm]
    if: always() && needs.changes.outputs.code == 'true' && needs.test-arm.result == 'failure'
    name: test (ubuntu-24.04-arm, again)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
      checks: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Two compile jobs at a time keep the build within the ARM runner's memory; with one per
      # core it is shut down while compiling the desktop app and web crates.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Retry only after a runner shutdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate \
            -q '.jobs[] | select(.name == "test (ubuntu-24.04-arm)") | .id' | head -1)
          [ -n "$job" ] || { echo "test (ubuntu-24.04-arm) not found in this run" >&2; exit 1; }
          notes=$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${job}/annotations" -q '.[].message')
          echo "$notes"
          if grep -qE 'exit code 143|shutdown signal' <<<"$notes"; then
            echo "The ARM runner was shut down; trying the tests once more."
          else
            echo "test (ubuntu-24.04-arm) failed on its own; not retried." >&2
            exit 1
          fi
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu-24.04-arm-debug
          save-if: false
      - run: cargo test --workspace --locked --features dutchman-gui/test-support

  # Docs-only changes skip the build jobs above; the tests that read README.md and docs/formats.md
  # still check them against the program.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu-latest-debug
          save-if: false
      - run: cargo test --locked -p dutchman --test readme
      - run: cargo test --locked -p dutchman --test cli formats_markdown_matches_the_formats_page

  # The same on macOS, only when Rust code changed: the account runs few macOS jobs at once.
  test-macos:
    name: test (macos-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos-latest-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # Builds the Docker image (docs/docker.md), converts a fixture in it, starts its MCP server,
  # and converts a fixture through its web server (docs/web.md).
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dutchman:ci
          # Two compile jobs keep the release build within the runner's memory; with one per
          # core the hosted runner was shut down mid-build.
          build-args: |
            CARGO_BUILD_JOBS=2
          cache-from: type=gha
          # Only main writes the layer cache; a pull request reads it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      - name: Convert a fixture in the image
        run: |
          fixtures="$PWD/crates/dutchman-core/tests/fixtures"
          docker run --rm -v "$fixtures:/work:ro" -v "$RUNNER_TEMP:/out" --user "$(id -u):$(id -g)" \
            dutchman:ci convert --json generated_unit_cube.f3d /out/cube.solidcraft | tee report.json
          grep -q '"ok":true' report.json
          test -s "$RUNNER_TEMP/cube.solidcraft"
      - name: Start the MCP server in the image
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | docker run --rm -i --entrypoint dutchman-mcp dutchman:ci | grep -q '"result"'
      - name: Convert through the web server in the image
        run: |
          docker run -d --name web -p 8080:8080 -e DUTCHMAN_WEB_PASSWORD=ci --entrypoint dutchman-web dutchman:ci
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 401
          curl -fsS -u dutchman:ci -F files=@crates/dutchman-core/tests/fixtures/generated_unit_cube.f3d \
            http://127.0.0.1:8080/api/convert | tee web.json
          grep -q '"converted":1' web.json
          download=$(grep -o '"download":"[^"]*"' web.json | cut -d'"' -f4)
          curl -fsS -u dutchman:ci -o cube.solidcraft "http://127.0.0.1:8080/$download"
          test -s cube.solidcraft
          docker rm -f web

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-linux-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked

  # Opens converted designs in the newest and oldest releases in the rolling 14-day
  # window (NEWEST_SOLIDCRAFT and WINDOW_OLDEST). Informational:
  # a SolidCraft change must not block Dutchman's own checks.
  solidcraft-roundtrip:
    name: solidcraft-roundtrip (${{ matrix.solidcraft.version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        solidcraft:
          - version: 0.18.2
            sha256: 9d0c922ac72204f34ad22ca7a171be78016ab002e304ace3c07d34d187d830ff
          - version: newest
    env:
      SOLIDCRAFT_VERSION: ${{ matrix.solidcraft.version }}
      SOLIDCRAFT_SHA256: ${{ matrix.solidcraft.sha256 }}
      # Full debug info for the whole workspace filled the runner: the linker died with a bus
      # error. The checks need only the dutchman binary and no debug info.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # The runner's preinstalled toolchains leave too little disk for a debug build of every
      # crate: free the ones these jobs never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: roundtrip-linux-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked -p dutchman --bin dutchman
      - run: df -h / .
      # Fetched archives are kept between runs, so a release server outage doesn't fail the
      # check: the script still verifies a cached archive against the release checksum.
      - uses: actions/cache@v6
        with:
          path: solidcraft-cache
          key: solidcraft-${{ matrix.solidcraft.version }}-${{ hashFiles('crates/dutchman-solidcraft/src/verify.rs') }}
          restore-keys: solidcraft-${{ matrix.solidcraft.version }}-
      - name: Fetch SolidCraft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOLIDCRAFT_CACHE: solidcraft-cache
        run: |
          # "newest" is the minor named by NEWEST_SOLIDCRAFT, so a new minor never edits this file.
          if [ "$SOLIDCRAFT_VERSION" = newest ]; then
            SOLIDCRAFT_VERSION=$(sed -n 's/^pub const NEWEST_SOLIDCRAFT: \[u64; 2\] = \[0, \([0-9]*\)\];$/0.\1/p' crates/dutchman-solidcraft/src/verify.rs)
            [[ $SOLIDCRAFT_VERSION =~ ^0\.[0-9]+$ ]] || { echo "NEWEST_SOLIDCRAFT not found" >&2; exit 1; }
          fi
          version=$(scripts/solidcraft-window.sh --fetch "$SOLIDCRAFT_VERSION" "$SOLIDCRAFT_SHA256")
          echo "SOLIDCRAFT_VERSION=$version" >> "$GITHUB_ENV"
      # Part fixtures hold a 10 mm cube; the assembly places two of those cubes.
      - name: Check converted geometry in SolidCraft
        run: |
          cube=1000:6:0,0,0:10,10,10
          fixtures=crates/dutchman-core/tests/fixtures
          scripts/solidcraft-roundtrip.sh "solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli" target/debug/dutchman \
            "$fixtures/generated_unit_cube.f3d=$cube" \
            "$fixtures/synthetic_cube.ipt=$cube" \
            "$fixtures/solidworks_cube.sldprt=$cube" \
            "$fixtures/placed_cubes.sldasm=2000:12:0,0,0:30,10,10"
      - name: Replay histories in SolidCraft
        run: |
          export SOLIDCRAFT_CLI="$PWD/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli"
          cargo test --locked -p dutchman-solidcraft --test history --test assembly

  # One result for branch rules to require: it always runs, and fails only when a job it needs
  # failed or was cancelled. Jobs a change skips (a docs-only change skips the builds and tests)
  # count as passed, so a required check never waits for a job that never starts.
  ci-result:
    needs: [changes, fmt, release-notes, clippy, test, test-arm, test-arm-again, docs, test-macos, docker, msrv, solidcraft-roundtrip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {job: need["result"] for job, need in needs.items() if need["result"] in ("failure", "cancelled")}
          # test-arm-again runs only when test-arm failed, and passes only after a runner
          # shutdown and a passing second try: then the first try does not count.
          if needs.get("test-arm-again", {}).get("result") == "success":
              bad.pop("test-arm", None)
          for job, need in sorted(needs.items()):
              print(job + ": " + need["result"])
          sys.exit(f"failed or cancelled: {bad}" if bad else 0)
          '
