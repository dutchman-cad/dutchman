name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # Inventor and SolidWorks users are mostly on Windows; macOS has a case-insensitive
    # filesystem. Both matter to finding an assembly's part files.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  # Opens converted designs in a released SolidCraft. Informational: a SolidCraft change
  # must not block Dutchman's own checks.
  solidcraft-roundtrip:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SOLIDCRAFT_VERSION: 0.17.0
      SOLIDCRAFT_SHA256: 4032f1e7da8519982580dbcb2cd87d0906d49781293f466e78751f891e0ea614
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Fetch SolidCraft
        run: |
          archive="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}/$archive"
          echo "${SOLIDCRAFT_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive"
      - run: scripts/solidcraft-roundtrip.sh "solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli" target/debug/dutchman crates/dutchman-core/tests/fixtures/generated_unit_cube.f3d crates/dutchman-core/tests/fixtures/synthetic_cube.ipt
      - name: Replay histories in SolidCraft
        run: |
          export SOLIDCRAFT_CLI="$PWD/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli"
          cargo test --locked -p dutchman-solidcraft --test history --test assembly
