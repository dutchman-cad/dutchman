name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand, and by the SolidCraft window workflow for the pull request it opens (pull
  # requests opened with the default token do not start workflows). Judged like a pull request.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Whether the change touches Rust code, which the macOS tests (macOS runners are scarce) wait on;
  # whether it is code at all (a docs-only change runs only the docs and release-notes jobs);
  # or the Docker image, which the Docker job waits on (on pull requests, only the image's own
  # inputs; on main, any crate).
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      code: ${{ steps.diff.outputs.code }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything besides Markdown, docs/, assets/, images and changelog fragments is code.
          if git diff --name-only "$BASE" HEAD \
            | grep -qvE '(\.md$|^docs/|^assets/|^changelog\.d/|\.(png|jpe?g|svg|webp)$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BASE" HEAD \
            | grep -qE '^(crates/|Cargo\.(toml|lock)$|clippy\.toml$|rust-toolchain|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          # The image is a full release build (40-80 minutes), so pull requests build it only when
          # the image itself or the web server it serves changes; every push to main builds it.
          if [ "${{ github.event_name }}" = push ]; then
            image='^(crates/|Cargo\.(toml|lock)$|Dockerfile$|\.dockerignore$|\.github/workflows/ci\.yml$)'
          else
            image='^(Dockerfile$|\.dockerignore$|crates/dutchman-web/|docs/docker\.md$|\.github/workflows/ci\.yml$)'
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE "$image"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/changelog.py check

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Inventor and SolidWorks users are mostly on Windows; macOS has a case-insensitive
    # filesystem. Both matter to finding an assembly's part files.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Debug info is most of a cold Windows build's time and is not needed to run the tests.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Save the build even when a test fails, so the next run does not start cold.
          cache-on-failure: true
      - run: cargo test --workspace --locked
      # A build without FreeCAD says it leaves FreeCAD files out. This checks feature gating, not
      # the platform, and on another OS it would rebuild every crate a second time.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p dutchman --no-default-features

  # Docs-only changes skip the build jobs above; the tests that read README.md and docs/formats.md
  # still check them against the program.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p dutchman --test readme
      - run: cargo test --locked -p dutchman --test cli formats_markdown_matches_the_formats_page

  # The same on macOS, only when Rust code changed: the account runs few macOS jobs at once.
  test-macos:
    name: test (macos-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --workspace --locked

  # Builds the Docker image (docs/docker.md), converts a fixture in it, starts its MCP server,
  # and converts a fixture through its web server (docs/web.md).
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dutchman:ci
          # Two compile jobs keep the release build within the runner's memory; with one per
          # core the hosted runner was shut down mid-build.
          build-args: |
            CARGO_BUILD_JOBS=2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Convert a fixture in the image
        run: |
          fixtures="$PWD/crates/dutchman-core/tests/fixtures"
          docker run --rm -v "$fixtures:/work:ro" -v "$RUNNER_TEMP:/out" --user "$(id -u):$(id -g)" \
            dutchman:ci convert --json generated_unit_cube.f3d /out/cube.solidcraft | tee report.json
          grep -q '"ok":true' report.json
          test -s "$RUNNER_TEMP/cube.solidcraft"
      - name: Start the MCP server in the image
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | docker run --rm -i --entrypoint dutchman-mcp dutchman:ci | grep -q '"result"'
      - name: Convert through the web server in the image
        run: |
          docker run -d --name web -p 8080:8080 -e DUTCHMAN_WEB_PASSWORD=ci --entrypoint dutchman-web dutchman:ci
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 401
          curl -fsS -u dutchman:ci -F files=@crates/dutchman-core/tests/fixtures/generated_unit_cube.f3d \
            http://127.0.0.1:8080/api/convert | tee web.json
          grep -q '"converted":1' web.json
          download=$(grep -o '"download":"[^"]*"' web.json | cut -d'"' -f4)
          curl -fsS -u dutchman:ci -o cube.solidcraft "http://127.0.0.1:8080/$download"
          test -s cube.solidcraft
          docker rm -f web

  # Quick release builds of the three programs for each platform, kept as artifacts for 14 days
  # (dutchman-<target>), so a change can be tried without building it: scripts/fetch-ci-binary.sh.
  # No job waits on this one; it is not a gate. LTO is off and codegen units are 16 to build faster
  # than a release; these are not the published release binaries.
  binaries:
    name: binaries (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: binaries-${{ matrix.target }}
          cache-on-failure: true
      - name: Build
        run: >
          cargo build --release --locked -p dutchman -p dutchman-gui
          --config profile.release.lto=false --config profile.release.codegen-units=16
      - name: Stage
        shell: bash
        run: |
          exe=""
          [[ '${{ matrix.target }}' == *windows* ]] && exe=".exe"
          mkdir -p stage
          for program in dutchman dutchman-mcp dutchman-gui; do
            cp "target/release/$program$exe" stage/
          done
          cp LICENSE NOTICE stage/
          stage/dutchman$exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: dutchman-${{ matrix.target }}
          path: stage/
          if-no-files-found: error
          retention-days: 14

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  # Opens converted designs in the newest and oldest releases in the rolling 14-day
  # window (NEWEST_SOLIDCRAFT and WINDOW_OLDEST). Informational:
  # a SolidCraft change must not block Dutchman's own checks.
  solidcraft-roundtrip:
    name: solidcraft-roundtrip (${{ matrix.solidcraft.version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        solidcraft:
          - version: 0.18.2
            sha256: 9d0c922ac72204f34ad22ca7a171be78016ab002e304ace3c07d34d187d830ff
          - version: newest
    env:
      SOLIDCRAFT_VERSION: ${{ matrix.solidcraft.version }}
      SOLIDCRAFT_SHA256: ${{ matrix.solidcraft.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Fetch SolidCraft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # "newest" is the minor named by NEWEST_SOLIDCRAFT, so a new minor never edits this file.
          if [ "$SOLIDCRAFT_VERSION" = newest ]; then
            SOLIDCRAFT_VERSION=$(sed -n 's/^pub const NEWEST_SOLIDCRAFT: \[u64; 2\] = \[0, \([0-9]*\)\];$/0.\1/p' crates/dutchman-solidcraft/src/verify.rs)
            [[ $SOLIDCRAFT_VERSION =~ ^0\.[0-9]+$ ]] || { echo "NEWEST_SOLIDCRAFT not found" >&2; exit 1; }
          fi
          version=$(scripts/solidcraft-window.sh --fetch "$SOLIDCRAFT_VERSION" "$SOLIDCRAFT_SHA256")
          echo "SOLIDCRAFT_VERSION=$version" >> "$GITHUB_ENV"
      # Each fixture holds cadmpeg's example 10 mm cube, which must read back as one.
      - name: Check converted geometry in SolidCraft
        run: |
          cube=1000:6:0,0,0:10,10,10
          fixtures=crates/dutchman-core/tests/fixtures
          scripts/solidcraft-roundtrip.sh "solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli" target/debug/dutchman \
            "$fixtures/generated_unit_cube.f3d=$cube" \
            "$fixtures/synthetic_cube.ipt=$cube" \
            "$fixtures/solidworks_cube.sldprt=$cube"
      - name: Replay histories in SolidCraft
        run: |
          export SOLIDCRAFT_CLI="$PWD/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli"
          cargo test --locked -p dutchman-solidcraft --test history --test assembly
