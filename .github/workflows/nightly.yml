name: Nightly

# Builds Dutchman's main against cadmpeg's main, every day and on demand, and publishes the
# archives as the rolling `nightly` pre-release: the way a cadmpeg fix merged after the commit
# stable builds pin reaches users before the next stable release. cadmpeg's main is taken only
# here, at build time (scripts/use-cadmpeg-main.sh); nothing about it is committed, and stable
# releases keep the pinned commit. Nothing is published unless every test and the SolidCraft
# round trip pass. A run is skipped when neither main changed since the last nightly.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when neither main changed since the last nightly
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CADMPEG_REPO: https://github.com/cadmpeg/cadmpeg
  SOLIDCRAFT_VERSION: 0.19.0
  SOLIDCRAFT_SHA256: 1e3650237a617667f557a16e865bbf544b20ece1dec39f7c380239d7058d632d

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
      dutchman: ${{ steps.compare.outputs.dutchman }}
      cadmpeg: ${{ steps.compare.outputs.cadmpeg }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          dutchman=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          cadmpeg=$(git ls-remote "$CADMPEG_REPO" refs/heads/main | cut -f1)
          [ -n "$dutchman" ] && [ -n "$cadmpeg" ]
          echo "dutchman=$dutchman" >> "$GITHUB_OUTPUT"
          echo "cadmpeg=$cadmpeg" >> "$GITHUB_OUTPUT"
          last=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          if [ "$FORCE" != true ] && grep -q "$dutchman" <<<"$last" && grep -q "$cadmpeg" <<<"$last"; then
            echo "Neither main changed since the last nightly; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: scripts/use-cadmpeg-main.sh "${{ needs.changes.outputs.cadmpeg }}"
      - run: cargo test --workspace

  roundtrip:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/use-cadmpeg-main.sh "${{ needs.changes.outputs.cadmpeg }}"
      - run: cargo build
      - name: Fetch SolidCraft
        run: |
          archive="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}/$archive"
          echo "${SOLIDCRAFT_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive"
      - name: Check converted geometry in SolidCraft
        run: |
          cube=1000:6:0,0,0:10,10,10
          fixtures=crates/dutchman-core/tests/fixtures
          scripts/solidcraft-roundtrip.sh "solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli" target/debug/dutchman \
            "$fixtures/generated_unit_cube.f3d=$cube" \
            "$fixtures/synthetic_cube.ipt=$cube" \
            "$fixtures/solidworks_cube.sldprt=$cube"
      - name: Replay histories in SolidCraft
        run: |
          export SOLIDCRAFT_CLI="$PWD/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli"
          cargo test -p dutchman-solidcraft --test history --test assembly

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: debian:bookworm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:bookworm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config python3 libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - shell: bash
        run: scripts/use-cadmpeg-main.sh "${{ needs.changes.outputs.cadmpeg }}"
      - name: Build archive programs
        shell: bash
        run: |
          packages=(-p dutchman -p dutchman-gui)
          if [[ '${{ matrix.target }}' == *linux* ]]; then
            packages+=(-p dutchman-web)
          fi
          cargo build --release "${packages[@]}" --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-nightly-${{ matrix.target }}" "${{ needs.changes.outputs.dutchman }}")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          retention-days: 7

  # Both Mac targets on one Apple silicon runner (Intel cross-compiled), then the disk image.
  macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/use-cadmpeg-main.sh "${{ needs.changes.outputs.cadmpeg }}"
      - run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p dutchman -p dutchman-gui --target "$target"
          done
      - name: Package
        run: |
          ref="${{ needs.changes.outputs.dutchman }}"
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dutchman"))')
          scripts/package-archive.sh aarch64-apple-darwin dutchman-nightly-aarch64-apple-darwin "$ref"
          SKIP_RUN=1 scripts/package-archive.sh x86_64-apple-darwin dutchman-nightly-x86_64-apple-darwin "$ref"
          scripts/macos-dmg.sh "$version" nightly \
            target/aarch64-apple-darwin/release target/x86_64-apple-darwin/release \
            dist/dutchman-nightly-macos-universal.dmg
          (cd dist && shasum -a 256 dutchman-nightly-macos-universal.dmg > dutchman-nightly-macos-universal.dmg.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: dutchman-nightly-macos
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 7

  publish:
    needs: [changes, test, roundtrip, build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DUTCHMAN_SHA: ${{ needs.changes.outputs.dutchman }}
      CADMPEG_SHA: ${{ needs.changes.outputs.cadmpeg }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dutchman-nightly-*
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
          path: source
      - name: Replace the nightly pre-release
        run: |
          date=$(date -u +%Y-%m-%d)
          cat > notes.md <<EOF
          Nightly, not a stable release.

          - Dutchman main @ ${DUTCHMAN_SHA}
          - cadmpeg main @ ${CADMPEG_SHA}
          - Built ${date}

          Dutchman's main built against cadmpeg's main, with every test and the SolidCraft round
          trip passing. Use it when an issue says a fix is merged but not yet released; otherwise
          use the latest stable release.

          EOF
          python3 -I source/scripts/downloads.py nightly >> notes.md
          # Move the tag; stable tags are never touched.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -f sha="$DUTCHMAN_SHA" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/nightly -f sha="$DUTCHMAN_SHA"
          if gh release view nightly --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            for asset in $(gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              gh release delete-asset nightly "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --prerelease --title "Nightly ${date}" --notes-file notes.md
          else
            gh release create nightly --repo "$GITHUB_REPOSITORY" --prerelease --title "Nightly ${date}" \
              --notes-file notes.md --verify-tag
          fi
          gh release upload nightly artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  image:
    needs: [changes, publish]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DUTCHMAN_SHA: ${{ needs.changes.outputs.dutchman }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dutchman-*-unknown-linux-gnu.tar.gz
          path: artifacts
          merge-multiple: true
      - name: Verify and unpack Linux archives
        run: bash docker/prepare-context.sh artifacts build-context
      - name: Read image metadata
        id: metadata
        run: |
          python3 - <<'PYMETA'
          import os, tomllib
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["workspace"]["package"]
          version = package["version"]
          version = "nightly-" + os.environ["DUTCHMAN_SHA"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"version={version}", file=f)
              print(f"licenses={package['license']}", file=f)
          PYMETA
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: build-context
          file: docker/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dutchman-cad/dutchman:nightly
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
