name: Nightly

# Builds Dutchman's main against cadmpeg's main, every day and on demand, and publishes the
# archives as the rolling `nightly` pre-release: the way a cadmpeg fix merged after the commit
# stable builds pin reaches users before the next stable release. cadmpeg's main is taken only
# here, at build time (scripts/use-cadmpeg-main.sh); nothing about it is committed, and stable
# releases keep the pinned commit. Nothing is published unless every test and the SolidCraft
# round trip pass. A run is skipped when neither main changed since the last nightly.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when neither main changed since the last nightly
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CADMPEG_REPO: https://github.com/cadmpeg/cadmpeg
  # Debug info filled the runners: the linker died with a bus error. No job here needs it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
      dutchman: ${{ steps.compare.outputs.dutchman }}
      cadmpeg: ${{ steps.compare.outputs.cadmpeg }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          dutchman=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          cadmpeg=$(git ls-remote "$CADMPEG_REPO" refs/heads/main | cut -f1)
          [ -n "$dutchman" ] && [ -n "$cadmpeg" ]
          echo "dutchman=$dutchman" >> "$GITHUB_OUTPUT"
          echo "cadmpeg=$cadmpeg" >> "$GITHUB_OUTPUT"
          last=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          if [ "$FORCE" != true ] && grep -q "$dutchman" <<<"$last" && grep -q "$cadmpeg" <<<"$last"; then
            echo "Neither main changed since the last nightly; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The Linux runner fills its disk building every crate's tests: free toolchains no job
      # here uses.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: scripts/use-cadmpeg-main.sh "${{ needs.changes.outputs.cadmpeg }}"
      - run: cargo test --workspace

  roundtrip:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled toolchains leave too little disk for a debug build of every
      # crate: free the ones these jobs never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/use-cadmpeg-main.sh "${{ needs.changes.outputs.cadmpeg }}"
      - run: cargo build -p dutchman --bin dutchman
      - name: Fetch SolidCraft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The newest minor Dutchman knows, as the pull request roundtrip uses.
          SOLIDCRAFT_VERSION=$(sed -n 's/^pub const NEWEST_SOLIDCRAFT: \[u64; 2\] = \[0, \([0-9]*\)\];$/0.\1/p' crates/dutchman-solidcraft/src/verify.rs)
          [[ $SOLIDCRAFT_VERSION =~ ^0\.[0-9]+$ ]] || { echo "NEWEST_SOLIDCRAFT not found" >&2; exit 1; }
          version=$(scripts/solidcraft-window.sh --fetch "$SOLIDCRAFT_VERSION" "")
          echo "SOLIDCRAFT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check converted geometry in SolidCraft
        run: |
          cube=1000:6:0,0,0:10,10,10
          fixtures=crates/dutchman-core/tests/fixtures
          scripts/solidcraft-roundtrip.sh "solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli" target/debug/dutchman \
            "$fixtures/generated_unit_cube.f3d=$cube" \
            "$fixtures/synthetic_cube.ipt=$cube" \
            "$fixtures/solidworks_cube.sldprt=$cube" \
            "$fixtures/placed_cubes.sldasm=2000:12:0,0,0:30,10,10"
          # TODO(edrawings): re-enable once the cadmpeg pin ships the edrawings codec
          #   "$fixtures/synthetic_cube.eprt=$cube"
          #   "$fixtures/synthetic_assembly.easm=3000:18:0,0,0:50,40,15"
          #   "$fixtures/synthetic_sw_assembly.easm=9000:48:0,0,0:110.0000013,39.9999991,80.0000001"
      - name: Replay histories in SolidCraft
        run: |
          export SOLIDCRAFT_CLI="$PWD/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin/solidcraft-cli"
          cargo test -p dutchman-solidcraft --test history --test assembly

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: debian:bookworm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:bookworm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config python3 libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - shell: bash
        run: scripts/use-cadmpeg-main.sh "${{ needs.changes.outputs.cadmpeg }}"
      - name: Build archive programs
        shell: bash
        run: |
          packages=(-p dutchman -p dutchman-gui)
          if [[ '${{ matrix.target }}' == *linux* ]]; then
            packages+=(-p dutchman-web)
          fi
          export DUTCHMAN_NIGHTLY_VERSION=$(scripts/nightly-version.sh "${{ needs.changes.outputs.dutchman }}")
          cargo build --release "${packages[@]}" --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-nightly-${{ matrix.target }}" "${{ needs.changes.outputs.dutchman }}")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          retention-days: 7

  # Each Mac target gets an Apple silicon runner; Intel stays cross-compiled.
  macos-build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Share each target's release dependencies with main's nightly, including tag runs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release-${{ matrix.target }}
      - run: scripts/use-cadmpeg-main.sh "${{ needs.changes.outputs.cadmpeg }}"
      - name: Build archive programs
        run: |
          export DUTCHMAN_NIGHTLY_VERSION=$(scripts/nightly-version.sh "${{ needs.changes.outputs.dutchman }}")
          cargo build --release --locked -p dutchman -p dutchman-gui --target ${{ matrix.target }}
      - name: Package
        run: |
          if [[ '${{ matrix.target }}' == x86_64-apple-darwin ]]; then
            export SKIP_RUN=1
          fi
          archive=$(scripts/package-archive.sh ${{ matrix.target }} "dutchman-nightly-${{ matrix.target }}" "${{ needs.changes.outputs.dutchman }}")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-archive-${{ matrix.target }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          retention-days: 7

  # Reuse the checked archives for the universal archive and disk image; no second Rust build.
  macos:
    needs: [changes, macos-build]
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-archive-*
          path: dist
          merge-multiple: true
      - name: Package
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          name=dutchman-nightly
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            archive="${name}-${target}.tar.gz"
            (cd dist && shasum -a 256 -c "$archive.sha256" && tar xzf "$archive")
          done
          scripts/package-universal.sh "${name}-macos-universal" "${{ needs.changes.outputs.dutchman }}" \
            "dist/${name}-aarch64-apple-darwin" "dist/${name}-x86_64-apple-darwin"
          dmg="${name}-macos-universal.dmg"
          scripts/macos-dmg.sh "$version" "nightly" \
            "dist/${name}-aarch64-apple-darwin" "dist/${name}-x86_64-apple-darwin" "dist/$dmg"
          (cd dist && shasum -a 256 "$dmg" > "$dmg.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: dutchman-nightly-macos
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 7

  publish:
    needs: [changes, test, roundtrip, build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DUTCHMAN_SHA: ${{ needs.changes.outputs.dutchman }}
      CADMPEG_SHA: ${{ needs.changes.outputs.cadmpeg }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dutchman-nightly-*
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
          path: source
      - name: Replace the nightly pre-release
        run: |
          date=$(date -u +%Y-%m-%d)
          cat > notes.md <<EOF
          Nightly, not a stable release.

          - Dutchman main @ ${DUTCHMAN_SHA}
          - cadmpeg main @ ${CADMPEG_SHA}
          - Built ${date}

          Dutchman's main built against cadmpeg's main, with every test and the SolidCraft round
          trip passing. Use it when an issue says a fix is merged but not yet released; otherwise
          use the latest stable release.

          EOF
          python3 -I source/scripts/downloads.py nightly >> notes.md
          # Move the tag; stable tags are never touched.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -f sha="$DUTCHMAN_SHA" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/nightly -f sha="$DUTCHMAN_SHA"
          # Publish a new release each run, so its date is the build's: fill a draft with the
          # files, then delete the old release (the tag stays) and publish the draft. Download
          # links by tag go dark only between those two calls.
          old=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" -q .id 2>/dev/null || true)
          new=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name=nightly \
            -f name="Nightly ${date}" -F body=@notes.md -F draft=true -F prerelease=true -q .id)
          for file in artifacts/*; do
            gh api -X POST "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${new}/assets?name=$(basename "$file")" \
              -H "Content-Type: application/octet-stream" --input "$file" > /dev/null
          done
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${old}"
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${new}" -F draft=false -F prerelease=true > /dev/null

  image:
    needs: [changes, publish]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DUTCHMAN_SHA: ${{ needs.changes.outputs.dutchman }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.dutchman }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dutchman-*-unknown-linux-gnu.tar.gz
          path: artifacts
          merge-multiple: true
      - name: Verify and unpack Linux archives
        run: bash docker/prepare-context.sh artifacts build-context
      - name: Read image metadata
        id: metadata
        run: |
          python3 - <<'PYMETA'
          import os, tomllib
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["workspace"]["package"]
          version = package["version"]
          version = "nightly-" + os.environ["DUTCHMAN_SHA"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"version={version}", file=f)
              print(f"licenses={package['license']}", file=f)
          PYMETA
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: build-context
          file: docker/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dutchman-cad/dutchman:nightly
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            LICENSES=${{ steps.metadata.outputs.licenses }}
