# Weekly dependency updates, grouped: one PR for minor and patch updates, one for majors.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Pinned git dependencies (cadmpeg, our own repos) move by hand after testing.
    ignore:
      - dependency-name: "cadmpeg*"
      - dependency-name: "dutchman*"
      # These majors change APIs we use; each moves in its own small pull request.
      - dependency-name: "getrandom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sysinfo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "base64"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "egui_extras"
        update-types: ["version-update:semver-major"]
      - dependency-name: "egui_kittest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pollster"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rfd"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # Its refs are toolchain names (1.88 is the MSRV), not action versions.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]
